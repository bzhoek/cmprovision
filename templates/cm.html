{% extends "app.html" %}
{% block title %}CM {{ serial }}{% endblock %}
{% block content %}
<div class="mb-4 flex items-center justify-between">
  <h1 class="text-xl font-semibold">CM <span class="font-mono">{{ serial }}</span></h1>
  <a href="/cms" class="btn-secondary">Back</a>
</div>
<div class="card">
  <dl class="divide-y divide-gray-100 text-sm">
    {% for (label, value) in rows %}
    <div class="grid grid-cols-3 gap-4 py-2"><dt class="text-gray-500">{{ label }}</dt><dd class="col-span-2 break-all">{{ value }}</dd></div>
    {% endfor %}
  </dl>
</div>
{% for (title, output) in outputs %}
<h2 class="mb-2 mt-6 font-semibold">{{ title }}</h2>
<pre class="overflow-x-auto rounded-lg bg-gray-900 p-4 text-xs text-gray-100">{{ output }}</pre>
{% endfor %}
{% endblock %}
