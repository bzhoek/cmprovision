{% extends "app.html" %}
{% block title %}Scripts{% endblock %}
{% block content %}
<div class="mb-4 flex items-center justify-between">
  <h1 class="text-xl font-semibold">Scripts</h1>
  <a href="/scripts/new" class="btn-primary">New script</a>
</div>
<div class="overflow-x-auto rounded-lg bg-white shadow">
  <table class="min-w-full divide-y divide-gray-200 text-sm">
    <thead class="bg-gray-50 text-left text-xs font-medium uppercase tracking-wide text-gray-500">
      <tr><th class="px-4 py-2">Name</th><th class="px-4 py-2">Type</th><th class="px-4 py-2">Priority</th><th class="px-4 py-2"></th></tr>
    </thead>
    <tbody class="divide-y divide-gray-100">
      {% for s in scripts %}
      <tr>
        <td class="px-4 py-2"><a href="/scripts/{{ s.id }}/edit" class="font-medium text-indigo-700 hover:underline">{{ s.name }}</a>{% if s.bg %} <span class="text-xs text-gray-500">(background)</span>{% endif %}</td>
        <td class="px-4 py-2">{{ s.script_type }}</td>
        <td class="px-4 py-2">{{ s.priority }}</td>
        <td class="px-4 py-2 text-right">
          <form method="post" action="/scripts/{{ s.id }}/delete" onsubmit="return confirm('Delete script {{ s.name }}?')"><button class="text-red-600 hover:underline">Delete</button></form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="px-4 py-6 text-center text-gray-500">No scripts yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
