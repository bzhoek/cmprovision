[package]
name = "cmprovision"
version = "2.0.0"
edition = "2024"
description = "Web application to mass provision Raspberry Pi Compute Modules"
license = "BSD-3-Clause"
repository = "https://github.com/bzhoek/cmprovision"

# Stripped by rustc, because the host's strip cannot handle cross-compiled ELF binaries.
[profile.release]
strip = true
lto = "thin"

# Same package name as the PHP releases, so installations upgrade in place.
[package.metadata.deb]
name = "cmprovision4"
revision = ""
maintainer = "Bas van der Hoek <bvdhoek@zilverline.com>"
copyright = "2021, Raspberry Pi"
license-file = ["LICENSE", "0"]
section = "admin"
priority = "optional"
depends = "libc6 (>= 2.31), rpiboot (>= 20220504~214218), dnsmasq-base, sudo, ca-certificates"
conflicts = "usbbootgui"
changelog = "debian/changelog"
maintainer-scripts = "debian/"
conf-files = ["/var/lib/cmprovision/etc/dnsmasq.conf"]
extended-description = """\
Serves the web interface, the provisioning endpoint and the boot files that \
let a Raspberry Pi 4 program Compute Modules connected to it over USB or Ethernet."""
assets = [
    ["target/release/cmprovision", "usr/bin/", "755"],
    ["scriptexecute/*", "var/lib/cmprovision/scriptexecute/", "644"],
    ["scriptexecute/overlays/*", "var/lib/cmprovision/scriptexecute/overlays/", "644"],
    ["etc/dnsmasq.conf", "var/lib/cmprovision/etc/", "644"],
    ["debian/010_cmprovision", "etc/sudoers.d/", "440"],
    ["debian/cmprovision.service", "lib/systemd/system/", "644"],
    ["debian/cmprovision-dnsmasq.service", "lib/systemd/system/", "644"],
    ["debian/cmprovision-rpiboot.service", "lib/systemd/system/", "644"],
]

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["form"] }
bcrypt = "0.19.3"
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
form_urlencoded = "1.2.2"
futures-util = "0.3.34"
hex = "0.4.3"
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["xz", "std"] }
nix = { version = "0.31.3", features = ["fs"] }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rpassword = "7.5.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
snmp2 = { version = "0.5.2", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
suppaftp = "12.2.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync"] }
totp-rs = { version = "6.0.0", features = ["qr", "gen_secret"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
bcrypt = "0.19.3"
flate2 = "1.1.10"
form_urlencoded = "1.2.2"
hex = "0.4.3"
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["xz", "std", "encoder"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
totp-rs = "6.0.0"
tower = { version = "0.5.3", features = ["util"] }
