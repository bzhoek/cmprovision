[package]
name = "cmprovision"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
form_urlencoded = "1.2.2"
hex = "0.4.3"
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["xz", "std"] }
rand = "0.10.3"
regex = "1.13.1"
sha2 = "0.11.1"
snmp2 = { version = "0.5.2", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
suppaftp = "12.2.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
flate2 = "1.1.10"
form_urlencoded = "1.2.2"
hex = "0.4.3"
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["xz", "std", "encoder"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
